<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0A3F44" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Mortarboard Top (Diamond) -->
  <path d="M32 15 L52 24.5 L32 34 L12 24.5 Z" fill="#FFFFFF" />

  <!-- Mortarboard Skullcap (Lower Rim) -->
  <path d="M19 28.5 V37 C19 41.5 24.8 45 32 45 C39.2 45 45 41.5 45 37 V28.5" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Golden Tassel Cord and Fringe -->
  <path d="M47 26.5 V38" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="47" cy="40.5" r="3" fill="url(#gold-grad)" />

  <!-- Corner Golden Accent Star -->
  <circle cx="49" cy="14" r="3.5" fill="#FBBF24" />
  <circle cx="49" cy="14" r="1.5" fill="#FFFFFF" />
</svg>
